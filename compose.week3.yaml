name: week3_lab
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local_lab_only
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 2s
      timeout: 5s
      retries: 15
  web:
    image: csce431-rails:8.1.3.1
    working_dir: /app
    command: sh -c "bundle install && bin/rails db:prepare && exec bin/rails server -b 0.0.0.0 -P /tmp/week3.pid"
    ports:
      - "127.0.0.1:3400:3000"
    environment:
      DB_HOST: db
      DB_USER: lab
      DB_PASSWORD: local_lab_only
      DB_NAME: week3_development
      TEST_DB_NAME: week3_test
    volumes:
      - .:/app
      - gems:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
  production:
    image: csce431-rails:8.1.3.1
    working_dir: /app
    command: sh -c 'export SECRET_KEY_BASE=$$(bin/rails secret); bin/rails db:prepare && bin/rails db:seed && bin/rails assets:precompile && exec bin/rails server -b 0.0.0.0 -P /tmp/week3-production.pid'
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: '1'
      DATABASE_URL: postgres://lab:local_lab_only@db/week3_production
    volumes:
      - .:/app
      - gems:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
  production_preview:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3401:80"
    volumes:
      - ./config/week3-preview.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - production
volumes:
  db_data:
  gems:
