name: book_collection
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: local_books
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books"]
      interval: 2s
      timeout: 5s
      retries: 15
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: csce431-rails:8.1.3.1
    command: sh -c "bundle install && bin/rails db:prepare && rm -f tmp/pids/server.pid && exec bin/rails server -b 0.0.0.0"
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      DB_HOST: db
      DB_USER: books
      DB_PASSWORD: local_books
    volumes:
      - .:/app
      - gems:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  gems:
    name: book_collection_gems
